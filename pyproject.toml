[project]
name = "claude-telegram-bot-v2"
version = "0.1.0"
description = "Bot de Telegram (aiogram) que faz streaming das respostas do Claude Code via sendMessageDraft"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiogram==3.31.0",
    "python-dotenv==1.2.2",
    "APScheduler==3.11.2",
    "tzdata",
]

[project.scripts]
tgclaude = "tgclaude.app:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tgclaude"

[dependency-groups]
dev = ["ruff==0.15.18", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
